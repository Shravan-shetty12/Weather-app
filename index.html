<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Weather forecasting application providing current weather information."
    >

    <title>Weather Forecasting App</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

    <div class="card">

        <!-- =========================
             SEARCH
        ========================== -->

        <div class="search">

            <input
                type="text"
                placeholder="Enter city name"
                spellcheck="false"
                autocomplete="off"
            >

            <button type="button">
                Search
            </button>

        </div>


        <!-- =========================
             ERROR MESSAGE
        ========================== -->

        <div class="error">

            <p>City not found</p>

        </div>


        <!-- =========================
             WEATHER INFORMATION
        ========================== -->

        <div class="weather">

            <img
                src="images/drizzle.png"
                class="weather-icon"
                width="100"
                height="100"
                alt="Weather condition"
            >


            <h1 class="temp">
                25°C
            </h1>


            <h2 class="city">
                New York, USA
            </h2>


            <!-- =========================
                 WEATHER DETAILS
            ========================== -->

            <div class="details">


                <!-- HUMIDITY -->

                <div class="col">

                    <img
                        src="images/humidity.png"
                        alt="Humidity"
                        width="30"
                        height="30"
                    >

                    <div>

                        <p class="humudity">
                            50%
                        </p>

                        <p>
                            Humidity
                        </p>

                    </div>

                </div>


                <!-- WIND -->

                <div class="col">

                    <img
                        src="images/wind.png"
                        alt="Wind speed"
                        width="30"
                        height="30"
                    >

                    <div>

                        <p class="wind_speed">
                            10 km/h
                        </p>

                        <p>
                            Wind
                        </p>

                    </div>

                </div>


            </div>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
